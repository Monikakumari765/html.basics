<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            background: lightgoldenrodyellow;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 30px;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
        
    </style>
</head>
<body>

<h1>My first Image Gallery</h1>
<div class="gallery">

    <a href="https://a-z-animals.com/media/2021/11/Best-Pet-Snakes-Boa-Constrictor.jpg" target="_blank">
        <img src="https://a-z-animals.com/media/2021/11/Best-Pet-Snakes-Boa-Constrictor.jpg" alt="Boa Constrictor">
    </a>

    <a href="https://a-z-animals.com/media/Guinea-fowl-4-1024x535.jpg" target="_blank">
        <img src="https://a-z-animals.com/media/Guinea-fowl-4-1024x535.jpg" alt="Guinea Fowl">
    </a>

    <a href="https://media.istockphoto.com/id/146076494/photo/panda.jpg?s=1024x1024&w=is&k=20&c=riW7qeUwxGFuqHM0cHP4NGRHE9wkFZiC33YUeVgN6n8=" target="_blank">
