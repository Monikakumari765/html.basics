<!-- ============================= -->
<!-- LOGIN FORM -->
<!-- ============================= -->

<h2>Login Form</h2>

<form action="https://www.flipkart.com/search" method="GET">

    <!-- USERNAME -->
    <label for="login_username">Username:</label><br>
    <input 
        type="text" 
        id="login_username" 
        name="q" 
        placeholder="Enter username"
        required
        minlength="3"
    >
    <br><br>

    <!-- PASSWORD -->
    <!-- <label for="login_password">Password:</label><br>
    <input 
        type="password" 
        id="login_password"
        name="password"
        placeholder="Enter password"
        required
        minlength="6"
    > -->
    <br><br>

    <!-- SUBMIT BUTTON -->
    <input type="submit">

</form>

<hr>

<!-- ============================= -->
<!-- REGISTRATION FORM -->
<!-- ============================= -->

<h2>Registration Form</h2>

<form action="/register" method="POST">

    <!-- NAME -->
    <label for="name">Full Name:</label><br>
    <input 
        type="text"
        id="name"
        name="fullname"
        placeholder="Enter full name"
        required
    >
    <br><br>

    <!-- EMAIL -->
    <label for="email">Email:</label><br>
    <input 
        type="email"
        id="email"
        name="email"
        placeholder="Enter email"
        required
    >
    <br><br>

    <!-- PASSWORD -->
    <label for="reg_password">Password:</label><br>
    <input 
        type="password"
        id="reg_password"
        name="password"
        minlength="6"
        required
    >
    <br><br>

    <!-- AGE -->
    <label for="age">Age:</label><br>
    <input 
        type="number"
        id="age"
        name="age"
        min="1"
        max="100"
    >
    <br><br>

    <!-- DATE -->
    <label for="dob">Date of Birth:</label><br>
    <input 
        type="date"
        id="dob"
        name="dob"
    >
    <br><br>

    <!-- GENDER (RADIO) -->
    <p>Gender:</p>

    <input type="radio" id="male" name="monika" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="monika" value="female">
    <label for="female">Female</label>

    <br><br>

     <!-- hobbies (CHECKBOX) -->
    <p>Hobbies:</p>

    <input type="checkbox" id="reading" name="hobby" value="reading">
    <label for="reading">Reading</label>

    <input type="checkbox" id="sports" name="hobby" value="sports">
    <label for="sports">Sports</label>

    <input type="checkbox" id="music" name="hobby" value="music">
    <label for="music">Music</label>

    <br><br>

    <!-- Dropdown -->
    <label for="course">Select Course:</label><br>

    <select id="course" name="course">
        <option value="btech">HTML</option>
        <option value="mbbs">CSS</option>
        <option value="mca">JavaScript</option>
    </select>
  
   <!-- FILE UPLOAD -->
    <label for="resume">Upload Resume:</label><br>

    <input 
        type="file"
        id="resume"
        name="resume"
    >

    <br><br>

    <!-- TEXTAREA -->
    <label for="bio">Short Bio:</label><br>

    <textarea 
        id="bio"
        name="bio"
        rows="4"
        cols="30"
        placeholder="Write about yourself..."
    ></textarea>

    <br><br>

    <!-- SUBMIT -->
    <input type="submit" value="Register">

</form>

<hr>
